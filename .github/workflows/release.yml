name: Build and upload binaries to release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  github:
    name: Publish Release on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the release and upload assets via the GitHub Releases API
    env:
      # Keep in step with the SP1 crates in guest-builder/sp1/Cargo.lock.
      SP1_VERSION: v6.8.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          RUST_TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install SP1 toolchain
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v "$SP1_VERSION"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Check SP1 toolchain
        run: cargo prove --version

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build guest ELF and vk JSON
        # The guest build and vk derivation are both opt-in (see the crate's build.rs).
        working-directory: guest-builder/sp1
        env:
          BUILD_ELF: "1"
          BUILD_VKEY: "1"
        run: cargo build --locked --features docker-build

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          ELF_DIR=guest-builder/sp1/elfs
          cp "$ELF_DIR/moho.elf" dist/moho.elf
          cp "$ELF_DIR/moho-vk.json" dist/moho-vk.json
          (cd dist && sha256sum moho-vk.json > moho-vk.json.sha256)
          ls -la dist/

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/moho.elf dist/moho-vk.json dist/moho-vk.json.sha256)
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::missing artifact: $f"; exit 1; }
          done
          # Create the release as a draft so the assets can be attached before it is published.
          gh release create "$TAG" --draft --generate-notes
          gh release upload "$TAG" "${assets[@]}"
          gh release edit "$TAG" --draft=false

  cratesio:
    name: Publish Release to Crates.io
    runs-on: ubuntu-latest
    environment: cratesio
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
