[package]
edition = "2024"
name = "moho-sp1-guest-builder"
publish = false
version = "0.1.0"

# Standalone so the SP1 toolchain crates stay out of the root workspace and its lockfile.
[workspace]

[features]
default = []
docker-build = []

[build-dependencies]
sp1-build = "6.10.0"
sp1-sdk = { version = "6.10.0", features = ["blocking"] }
sp1-verifier = "6.10.0"
strata-predicate = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.5.0" }
zkaleido-sp1-groth16-verifier = { git = "https://github.com/alpenlabs/zkaleido", tag = "v0.5.0" }
